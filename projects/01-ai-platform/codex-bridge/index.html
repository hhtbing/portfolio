  <p class="tagline" data-lang-zh="运行在 Windows 主机上的 WPF 桌面应用，把远程 Linux / macOS / Windows 节点的 Codex 客户端接入本机 Codex App Server。" data-lang-en="WPF desktop app on Windows that connects remote Codex clients (Linux / macOS / Windows) to the local Codex App Server."></p>

<div class="section">
  <h2 data-lang-zh="核心功能" data-lang-en="Core Features"></h2>
  <ul><li data-lang-zh="Windows 侧 Codex 服务生命周期管理：启动、停止、重启、端口冲突与单实例处理" data-lang-en="Windows Codex service lifecycle: start, stop, restart, port conflicts and single-instance handling"></li><li data-lang-zh="Gateway 远程业务入口：只在 Windows Tailnet 地址监听 WebSocket 并转发到本机 App Server" data-lang-en="Gateway remote entry: listens only on the Windows Tailnet address and forwards to the local App Server"></li><li data-lang-zh="节点准入控制：允许/禁止模型，展示节点名、主机名、Tailnet 地址与会话状态" data-lang-en="Node admission control: allow/deny per node with name, hostname, Tailnet address and session state"></li><li data-lang-zh="Linux 节点常驻接入：systemd 服务模板、断线重连、脱敏连接报告" data-lang-en="Permanent Linux node onboarding: systemd templates, reconnect and sanitized connection reports"></li><li data-lang-zh="只读状态出口：供 AgentMeshOS 展示，不提供远程命令执行" data-lang-en="Read-only status export for AgentMeshOS; no remote command execution"></li></ul>
