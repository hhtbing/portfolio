<div class="section">
  <h2 data-lang-zh="概览" data-lang-en="Overview"></h2>
  <p data-lang-zh="面向个人和小团队的自托管 AI Agent 运行时平台，把分散计算节点、模型能力、任务调度与成果交付组织成可追溯的工作链。" data-lang-en="Self-hosted AI agent runtime platform for individuals and small teams, organizing distributed compute nodes, model capabilities, task scheduling, and artifact delivery into a traceable work chain."></p>
</div>
<div class="section">
  <h2 data-lang-zh="核心特性" data-lang-en="Core Features"></h2>
  <ul><li data-lang-zh="分布式任务调度：基于 Nomad 的任务分发、节点能力匹配、取消与恢复" data-lang-en="Distributed task scheduling: Nomad-based distribution, node capability matching, cancellation and recovery"></li><li data-lang-zh="AI BOSS 智能编排：自然语言需求、自动生成任务依赖图、智能选择 Worker" data-lang-en="AI BOSS orchestration: natural language requirements, dependency graph generation, intelligent worker selection"></li><li data-lang-zh="统一成果管理：SHA-256 文件级追溯、版本控制与回滚" data-lang-en="Unified artifact management: SHA-256 traceability, versioning and rollback"></li><li data-lang-zh="应用中心：应用注册、生命周期管理、标准化输入输出与自动归档" data-lang-en="Application center: registration, lifecycle, standardized I/O and auto archiving"></li><li data-lang-zh="安全边界：Worker 不接触云盘凭据，模型只能调用已注册能力" data-lang-en="Security boundaries: workers never touch cloud-storage credentials; models call only registered capabilities"></li></ul>
